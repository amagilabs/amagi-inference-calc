[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amagi-inference-calc"
version = "0.1.0"
description = "How much GPU does a local LLM need, and how fast will it run? VRAM, tokens/second and used-GPU cost per token/second for small-office setups, from a bandwidth model calibrated on real runs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AmagiLabs (Amagisolutionsgroup, Inc.)", email = "dev@amagisolutionsgroup.com" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["llm", "gpu", "vram", "calculator", "tokens-per-second", "llama.cpp", "gguf", "localllama", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/amagilabs/amagi-inference-calc"

[project.scripts]
amagi-inference-calc = "amagi_inference_calc.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amagi_inference_calc = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
